version: 1

indices:
  # Default index across the whole site (drives /query-index.json).
  default:
    include:
      - '/**'
    exclude:
      - '/drafts/**'
      - '/tools/**'
    target: /query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, 'content')
      author:
        select: head > meta[name="author"]
        value: attribute(el, 'content')
      publishDate:
        select: head > meta[name="publication-date"]
        value: attribute(el, 'content')
      template:
        select: head > meta[name="template"]
        value: attribute(el, 'content')
      lastModified:
        select: none
        value: parseTimestamp(headers['last-modified'], 'ddd, DD MMM YYYY hh:mm:ss GMT')

  # Dedicated index for magazine articles only — the article-list (dynamic) block
  # fetches /magazine/query-index.json (or filters /query-index.json to /magazine/).
  # Adding a new magazine article page automatically appears here with no code change.
  magazine:
    include:
      - '/us/en/magazine/**'
    exclude:
      - '/us/en/magazine'
    target: /us/en/magazine/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, 'content')
      author:
        select: head > meta[name="author"]
        value: attribute(el, 'content')
      publishDate:
        select: head > meta[name="publication-date"]
        value: attribute(el, 'content')
      template:
        select: head > meta[name="template"]
        value: attribute(el, 'content')
