version: 1

sitemaps:
  # Sitemap sourced from the default query-index. The index (see helix-query.yaml)
  # excludes /nav, /footer, /drafts/** and /tools/**, so those non-page paths never
  # appear in the sitemap. Published to /sitemap.xml (referenced from robots.txt).
  default:
    source: /query-index.json
    destination: /sitemap.xml
    # Absolute host for the <loc> URLs. Required here: the project has no
    # cdn.prod.host configured, so without an explicit origin the host resolves
    # to "undefined" (https://undefined/...). Must include the protocol.
    origin: https://main--wknd-mayur--mayur-b.aem.live
    lastmod: YYYY-MM-DD
